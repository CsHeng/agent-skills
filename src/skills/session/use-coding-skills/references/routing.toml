version = 1

[routing]
id = "use-coding-skills"
default_discovery = "native-description-match"
direct_match_bypasses_router = true
ambiguous_router = "use-coding-skills"
mode_selector = "workflow-mode-selection"
host_wrapper_role = "optional-user-specific-entry-hints"

[host_wrapper]
allowed = [
  "user preferences",
  "host and runtime constraints",
  "thin intent-to-public-skill hints",
]
forbidden = [
  "workflow phase graph",
  "phase-to-owner mapping",
  "repair states",
  "review budgets",
  "typed exits",
]

[composition]
primary_owner_count = 1
lifecycle_owner_category = "workflow"
overlay_categories = ["session", "discipline", "policy", "tool", "review-component"]
rendering_baseline = "output-styles"

[gate_policy]
design_phases = ["design-lite", "design-full"]
plan_phases = ["plan-lite", "plan", "minimal-plan"]
design_review_phase = "review-design"
plan_review_phase = "review-plan"
truth_sync_phase = "sync-truth"
close_phase = "close"
implicit_review_when_missing = true

[phase_routes]
analyze = "analyze-project"
triage = "analyze-project"
plan-lite = "plan-change"
minimal-plan = "plan-change"
design-lite = "design-change"
design-full = "design-change"
review-design = "review-change"
plan = "plan-change"
review-plan = "review-change"
execute = "implement-change"
verify = "implement-change"
review = "review-change"
review-impl = "review-change"
posthoc-review = "review-change"
sync-truth = "sync-truth"
close = "close-change"

[review_evaluators]
review-design = "review-design"
review-plan = "review-plan"
review = "review-implementation"
review-impl = "review-implementation"
posthoc-review = "review-implementation"

[support_routes]
response-shape = "output-styles"
search-and-tooling = "tool-decision-tree"
implementation-policy = "development-standards"
persisted-language-selection = "language-decision-tree"
infrastructure = "infrastructure-triage"
documentation = "organize-docs"
memory-and-session-mining = "skill-miner"

[[trigger_cases]]
id = "project-truth-audit"
owner = "analyze-project"
negative = [
  "Diagnose a live infrastructure incident whose runtime data path is the primary question.",
  "Implement a requested repository change.",
]
lexical_hints = ["analyze project", "repo truth", "architecture drift"]

[[trigger_cases]]
id = "change-scope-design"
owner = "design-change"
negative = [
  "Turn an already approved design into an execution-grade task plan.",
  "Implement an already approved plan.",
]
lexical_hints = ["design change", "design-lite", "design-full"]

[[trigger_cases]]
id = "execution-plan"
owner = "plan-change"
negative = [
  "Decide unresolved architecture boundaries that still require design.",
  "Execute tasks from an already approved plan.",
]
lexical_hints = ["implementation plan", "task DAG", "plan change"]

[[trigger_cases]]
id = "approved-plan-execution"
owner = "implement-change"
negative = [
  "Plan a change whose execution order is not yet approved.",
  "Perform a read-only project explanation with no requested mutation.",
]
lexical_hints = ["implement approved plan", "execute plan", "fix forward"]

[[trigger_cases]]
id = "explicit-via-herdr-approved-plan-execution"
owner = "implement-change-via-herdr"
positive = [
  "Explicitly invoke $coding:implement-change-via-herdr to execute an approved plan through owned Herdr tabs and panes.",
  "Explicitly ask to run an approved plan through Herdr while retaining the implement-change controller.",
]
negative = [
  "Implement an approved plan through the ordinary controller runtime without requesting Herdr.",
  "Use Herdr to choose tasks, adjudicate review findings, repair code, or own lifecycle continuation.",
]
lexical_hints = ["implement-change-via-herdr", "approved plan through Herdr"]

[[trigger_cases]]
id = "lifecycle-review-gate"
owner = "review-change"
negative = [
  "Implement accepted findings or mutate the reviewed code.",
  "Give informal feedback that is not a lifecycle review request.",
]
lexical_hints = ["review change", "review gate", "adjudicate findings"]

[[trigger_cases]]
id = "coding-skill-routing"
owner = "use-coding-skills"
negative = [
  "A request directly and confidently matches one public workflow or policy skill.",
  "A domain owner can answer without session-level routing guidance.",
]
lexical_hints = ["which skill", "route this request", "coding skills"]

[[trigger_cases]]
id = "session-boundary-handoff"
owner = "use-coding-skills"
negative = [
  "Recover persisted Codex JSONL history after explicitly invoking the recovery tool.",
  "Mine historical sessions for reusable skill improvements.",
]
lexical_hints = ["session handoff", "compaction", "memory boundary"]

[[trigger_cases]]
id = "documentation-organization"
owner = "organize-docs"
negative = [
  "Explain existing project truth without reorganizing documentation.",
  "Synchronize truth after a verified behavior change through the lifecycle gate.",
]
lexical_hints = ["organize docs", "README AGENTS split", "docs boundary"]

[[trigger_cases]]
id = "api-contract-governance"
owner = "api-contract-strategy"
negative = [
  "Make an ordinary implementation edit where the existing API contract is fixed.",
  "Choose general service boundaries unrelated to an API contract lifecycle.",
]
lexical_hints = ["API contract", "OpenAPI", "consumer compatibility"]

[[trigger_cases]]
id = "architecture-and-boundaries"
owner = "architecture-patterns"
negative = [
  "Select the implementation language for a new persisted boundary.",
  "Apply already decided boundaries while implementing an approved task.",
]
lexical_hints = ["architecture", "service boundary", "dependency direction"]

[[trigger_cases]]
id = "resilience-and-recovery"
owner = "error-patterns"
negative = [
  "Design application log fields or audit-event retention.",
  "Diagnose a specific infrastructure incident whose state owner is still unknown.",
]
lexical_hints = ["resilience", "retry", "recovery policy"]

[[trigger_cases]]
id = "infrastructure-data-path"
owner = "infrastructure-triage"
negative = [
  "Perform broad repository orientation without a runtime incident or infrastructure design question.",
  "Design in-process application error handling only.",
]
lexical_hints = ["infrastructure", "network path", "GitOps"]

[[trigger_cases]]
id = "verification-strategy"
owner = "testing-strategy"
negative = [
  "Choose among TDD, contract, property, characterization, runtime, or chaos oracles before planning.",
  "Apply one language's lint and test tooling conventions only.",
]
lexical_hints = ["testing strategy", "test layers", "verification scope"]

[[trigger_cases]]
id = "docker-multiarch"
owner = "docker-multiarch-build"
negative = [
  "Troubleshoot a general container runtime incident unrelated to image architecture.",
  "Harden a container image for security without a multi-architecture concern.",
]
lexical_hints = ["multiarch", "buildx", "amd64 arm64"]

[[trigger_cases]]
id = "web-content-retrieval"
owner = "web-fetch"
negative = [
  "Search local repository files or select an ad hoc local CLI.",
  "Control a signed-in browser UI rather than retrieve page content.",
]
lexical_hints = ["fetch URL", "read PDF", "web content"]

[[trigger_cases]]
id = "application-logging"
owner = "logging-standards"
negative = [
  "Implement input validation, injection prevention, CORS, TLS, or upload controls.",
  "Design retry and failure-recovery behavior without a logging question.",
]
lexical_hints = ["logging", "audit trail", "correlation ID"]

[[trigger_cases]]
id = "application-security-controls"
owner = "security-guardrails"
negative = [
  "Choose security audit events, redaction, retention, or tamper evidence for logs.",
  "Edit a SOPS age encryption policy or recipient boundary.",
]
lexical_hints = ["security guardrails", "input validation", "container hardening"]

[[trigger_cases]]
id = "sops-age-secrets"
owner = "sops-age-guardrails"
negative = [
  "Apply general application secret-handling policy without SOPS or age.",
  "Manage credentials through an unrelated infrastructure runtime.",
]
lexical_hints = ["SOPS", "age recipient", "encrypted_regex"]

[[trigger_cases]]
id = "focused-smart-commit"
owner = "smart-commit"
positive = [
  "Explicitly ask to group current working-tree diffs by business purpose and create focused local commits.",
  "Split staged and unstaged work into semantic commits without rewriting history.",
]
negative = [
  "Ask for a generic single commit with no grouping requirement.",
  "Ask to squash or rewrite unpushed commits.",
]
lexical_hints = ["smart commit", "group diffs", "focused commits"]

[[trigger_cases]]
id = "executable-oracle-selection"
owner = "executable-oracle-architecture-selector"
negative = [
  "Implement concrete tests after the oracle boundary is already approved.",
  "Run a known verification command for an existing task.",
]
lexical_hints = ["oracle strategy", "TDD or contract tests", "readiness gate"]

[[trigger_cases]]
id = "persisted-language-selection"
owner = "language-decision-tree"
negative = [
  "Choose an ad hoc command for the agent's current investigation.",
  "Edit an existing module whose language is already fixed.",
]
lexical_hints = ["choose language", "new service language", "persisted tool"]

[[trigger_cases]]
id = "ad-hoc-tool-selection"
owner = "tool-decision-tree"
negative = [
  "Use a routine known search command without a tool-choice decision.",
  "Choose the persisted implementation language for a repository artifact.",
]
lexical_hints = ["which CLI", "rg or grep", "COUNT PREVIEW EXECUTE"]

[[trigger_cases]]
id = "cross-language-implementation-policy"
owner = "development-standards"
negative = [
  "Select exact Python, Go, Lua, PowerShell, or Shell tooling conventions.",
  "Define executable test layers or arbitrary universal metric thresholds.",
]
lexical_hints = ["development standards", "maintainability policy", "smallest durable change"]

[[trigger_cases]]
id = "go-language-policy"
owner = "go-guidelines"
negative = [
  "Decide whether a new service should use Go or another language.",
  "Apply generic cross-language maintainability policy only.",
]
lexical_hints = ["Go module", "go test", "Go service"]

[[trigger_cases]]
id = "lua-language-policy"
owner = "lua-guidelines"
negative = [
  "Choose Lua as the persisted language for a new tool.",
  "Edit unrelated configuration that is not Lua.",
]
lexical_hints = ["Lua", "luac", "selene"]

[[trigger_cases]]
id = "powershell-language-policy"
owner = "powershell-guidelines"
negative = [
  "Choose PowerShell versus another persisted implementation language.",
  "Compose an ad hoc Shell command that is not PowerShell code.",
]
lexical_hints = ["PowerShell", "PSScriptAnalyzer", "approved verbs"]

[[trigger_cases]]
id = "python-language-policy"
owner = "python-guidelines"
negative = [
  "Choose Python as the language for a new persisted boundary.",
  "Select general verification architecture across languages.",
]
lexical_hints = ["Python", "uv", "ruff pytest"]

[[trigger_cases]]
id = "shell-language-policy"
owner = "shell-guidelines"
negative = [
  "Select Shell versus another language for a new persisted implementation.",
  "Choose among general search or structured-data tools without Shell-policy risk.",
]
lexical_hints = ["Shell", "set -euo pipefail", "ShellCheck"]

[[trigger_cases]]
id = "explicit-skill-history-mining"
owner = "skill-miner"
positive = [
  "Explicitly invoke $coding:skill-miner to audit configured agent histories for skill usage or improvement evidence.",
  "Explicitly invoke $coding:skill-miner to classify durable truth extraction and memory cleanup candidates.",
]
negative = [
  "Ask for ordinary current-repository analysis without explicitly selecting skill-miner.",
  "Ask which skill should route an ambiguous live request.",
]
lexical_hints = ["$coding:skill-miner", "mine sessions", "skill usage"]

[[trigger_cases]]
id = "explicit-codex-session-recovery"
owner = "codex-session-recovery"
positive = [
  "Explicitly invoke $coding:codex-session-recovery to audit or merge Codex JSONL histories across CODEX_HOME directories.",
  "Explicitly request the bounded session recovery workflow without touching SQLite, auth, memories, or logs.",
]
negative = [
  "Mine sessions for reusable workflow patterns rather than recover persisted history.",
  "Repair general Codex configuration or authentication state.",
]
lexical_hints = ["$coding:codex-session-recovery", "session JSONL", "CODEX_HOME"]

[[trigger_cases]]
id = "explicit-git-worktree-operation"
owner = "git-worktrees"
positive = [
  "Explicitly invoke $coding:git-worktrees to create, compare, integrate, repair, or clean up Git worktrees.",
  "Explicitly request worktree isolation for a bounded branch workflow.",
]
negative = [
  "Use the current checkout for ordinary serial implementation.",
  "Ask for generic Git status or commit operations without a worktree task.",
]
lexical_hints = ["$coding:git-worktrees", "git worktree", "isolated worktree"]

[[trigger_cases]]
id = "explicit-unpushed-history-squash"
owner = "smart-squash"
positive = [
  "Explicitly invoke $coding:smart-squash to reorganize or squash unpushed commits after preflight and approval.",
  "Explicitly request semantic cleanup of local unpublished history.",
]
negative = [
  "Group current working-tree diffs into new focused commits.",
  "Rewrite pushed history or perform an unapproved destructive reset.",
]
lexical_hints = ["$coding:smart-squash", "squash unpushed commits", "rewrite local history"]
