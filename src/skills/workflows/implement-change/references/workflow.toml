version = 2

[workflow]
id = "implement-change"
role = "controller"
entry_phase = "implement-serial"

[execution]
topology_owner = "plan-change"
runtime_binding_owner = "implement-change"
default_model_policy = "semantic-routing"
allowed_model_policies = ["semantic-routing", "inherit-main", "runtime-default"]
runtime_binding_backends = ["codex-native", "herdr"]
flag_absent_binding_backend = "herdr"
execution_profiles = ["deep", "balanced", "fast"]
reasoning_profiles = ["deep", "standard", "light"]
inherit_main_preserves_topology = true
allowed_parallel_may_serialize = true
required_parallel_capacity_exit = "parallel_capacity_required"
controller_converges_batches = true

[external_touch]
policy = "exact-existing-files-v1"
projection_field = "external_impl_file_refs"
actor = "main"
delegation = "forbidden"
parallel = "forbidden"
isolation = "controller-checkout"
mutation_owner = "implement-change"
broker_only = true
immutable_baseline = true
repair_chain = "parent-linked"
staging_checkpoint = "ledger-before-payload"
apply_cleanup_checkpoint = "applied-and-cleaned"
automatic_rollback = false
backend_envelope_exposure = false
execution_result_fields = ["allowed_external_touch_refs", "verified_external_changes"]

[explorer]
portable_eligibility = ["fast", "light", "shared-read-only", "no-write"]
requires_no_write_refs = true
physical_baseline = "parent-session"
reasoning_policy = "minimum-only-no-ceiling"
semantic_routing_shapes = ["parent-inherit", "effort-only-uplift", "model-plus-effort-uplift"]
required_uplift_rejection = "typed-stop-no-downgrade"
role_file_model_pin = "forbidden"
role_file_reasoning_pin = "forbidden"
requires_explicit_search_synthesis_split = true
synthesis_owner = "main"

[runtime_binding.codex_native]
envelope_schema_version = 2
role_agent_files_user_owned = true
role_file_precedence = ["project", "user"]
role_files_tracked_in_repository = false
all_policies_spawn_through_role_file = true
required_max_depth = 1
unconfigured_max_depth_evidence = "instruction-only"
command_job_supported = false
delegated_writer_requires_spawn_cwd = true
fallback_on_typed_stop = "main-serial"
reasoning_evidence = ["parent_reasoning_effort", "required_minimum_reasoning_effort"]
monotonic_reasoning_required = true

[runtime_binding.herdr]
envelope_schema_version = 1
wire_shape = "byte-compatible"
command_job_supported = true
adapter_skill = "implement-change-via-herdr"
explorer_cost_policy = "backend-specific-unchanged"

[workers]
default_eligible_delegation = "approved-policy"
requires_isolated_worktree_for_writes = true
delegated_recursion = false
may_widen_scope = false
may_integrate_peer_work = false
may_adjudicate_review = false
may_repair = false
may_decide_continuation = false
custom_role_guidance_may_pin_model = false

[[nodes]]
id = "implement-change"
role = "controller"
owns_repair_loop = true

[[nodes]]
id = "review-change"
role = "gate"

[[nodes]]
id = "review-implementation"
role = "evaluator"

[[nodes]]
id = "sync-truth"
role = "gate"

[[nodes]]
id = "close-change"
role = "gate"

[[edges]]
from = "implement-change"
to = "review-change"

[[edges]]
from = "review-change"
to = "review-implementation"

[[edges]]
from = "implement-change"
to = "sync-truth"

[[edges]]
from = "implement-change"
to = "close-change"

[[forbidden_edges]]
from = "review-implementation"
to = "implement-change"

[[forbidden_edges]]
from = "review-implementation"
to = "review-change"

[[forbidden_edges]]
from = "review-implementation"
to = "review-implementation"

[[forbidden_edges]]
from = "review-change"
to = "implement-change"

[review]
preferred_actor = "subagent"
fallback_actor = "main"
delegated_recursion = false
requires_bounded_brief = true
candidate_findings_only = true
adjudication_owner = "implement-change"

[repair]
owner = "implement-change"
initial_review_passes = 1
focused_verification_passes = 1
additional_same_slice_repair_attempts = 1
states = ["implement", "verify", "review", "classify", "diagnose", "repair"]
typed_exits = ["pass", "replan", "redesign", "needs-authority", "guarded-rollback", "non-convergent"]

[tail]
evidence_owner = "implement-change"
truth_scope_owner = "plan-change"
truth_mutation_owner = "sync-truth"
close_judgment_owner = "close-change"
truth_sync_controller_authority_requires = ["approved-plan", "resolved-design", "immutable-execution-result", "stable-truth-refs", "allowed-touch-set"]
execution_states = ["implementation-pending", "task-complete", "truth-sync-pending", "ready-for-close", "closed"]
successful_close_terminal = true
