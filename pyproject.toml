[project]
name = "coding-harness-development"
version = "0.0.0"
description = "Development-only validation contract for the coding harness migration."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.12",
  "ty>=0.0.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["src/runtime/harness/tests", "tests"]
pythonpath = ["src"]
cache_dir = "/Users/csheng/.cache/pytest/market-csheng-harness"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["archived"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.11"
