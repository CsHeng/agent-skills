version = 2

[workflow]
id = "implement-change"
role = "controller"
entry_phase = "implement-serial"

[execution]
topology_owner = "plan-change"
runtime_binding_owner = "implement-change"
default_model_policy = "semantic-routing"
allowed_model_policies = ["semantic-routing", "inherit-main", "runtime-default"]
execution_profiles = ["deep", "balanced", "fast"]
reasoning_profiles = ["deep", "standard", "light"]
inherit_main_preserves_topology = true
allowed_parallel_may_serialize = true
required_parallel_capacity_exit = "parallel_capacity_required"
controller_converges_batches = true

[workers]
default_eligible_delegation = "approved-policy"
requires_isolated_worktree_for_writes = true
delegated_recursion = false
may_widen_scope = false
may_integrate_peer_work = false
may_adjudicate_review = false
may_repair = false
may_decide_continuation = false
custom_role_guidance_may_pin_model = false

[[nodes]]
id = "implement-change"
role = "controller"
owns_repair_loop = true

[[nodes]]
id = "review-change"
role = "gate"

[[nodes]]
id = "review-implementation"
role = "evaluator"

[[nodes]]
id = "sync-truth"
role = "gate"

[[nodes]]
id = "close-change"
role = "gate"

[[edges]]
from = "implement-change"
to = "review-change"

[[edges]]
from = "review-change"
to = "review-implementation"

[[edges]]
from = "implement-change"
to = "sync-truth"

[[edges]]
from = "implement-change"
to = "close-change"

[[forbidden_edges]]
from = "review-implementation"
to = "implement-change"

[[forbidden_edges]]
from = "review-implementation"
to = "review-change"

[[forbidden_edges]]
from = "review-implementation"
to = "review-implementation"

[[forbidden_edges]]
from = "review-change"
to = "implement-change"

[review]
preferred_actor = "subagent"
fallback_actor = "main"
delegated_recursion = false
requires_bounded_brief = true
candidate_findings_only = true
adjudication_owner = "implement-change"

[repair]
owner = "implement-change"
initial_review_passes = 1
focused_verification_passes = 1
additional_same_slice_repair_attempts = 1
states = ["implement", "verify", "review", "classify", "diagnose", "repair"]
typed_exits = ["pass", "replan", "redesign", "needs-authority", "guarded-rollback", "non-convergent"]
