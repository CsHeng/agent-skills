version = 2

[[clusters]]
id = "lifecycle"
members = ["design-change", "plan-change", "implement-change", "review-change", "close-change"]
question = "Is a material design decision, an execution structure, or the execution itself still missing, or is the request to judge one given target or whether a verified change can close?"

[[clusters.handoffs]]
when = "Turn an already approved design into an execution-grade task plan."
owner = "plan-change"
instead_of = ["design-change"]

[[clusters.handoffs]]
when = "Implement an authorized bounded change or approved plan whose material decisions are settled, even when it touches architecture or stable truth."
owner = "implement-change"
instead_of = ["design-change", "plan-change"]

[[clusters.handoffs]]
when = "Plan a change whose scope or execution order is not yet resolved."
owner = "plan-change"
instead_of = ["implement-change"]

[[clusters.handoffs]]
when = "Explain current project or branch state read-only with no requested mutation or closure judgment."
owner = "analyze-project"
instead_of = ["implement-change", "close-change"]

[[clusters.handoffs]]
when = "Grill, stress-test, or challenge an existing design or plan at the user's explicit request."
owner = "design-change:stress-test-mode"
instead_of = ["review-change"]

[[clusters.handoffs]]
when = "Implement accepted findings or mutate the reviewed target."
owner = "implement-change"
instead_of = ["review-change"]

[[clusters.handoffs]]
when = "Report the outcome of the current implementation run."
owner = "implement-change"
instead_of = ["close-change"]

[[clusters]]
id = "truth-and-docs"
members = ["analyze-project", "organize-docs", "sync-truth"]
question = "Answer current facts read-only, write already verified behavior into stable docs, or change documentation ownership, layout, or search boundaries?"

[[clusters.handoffs]]
when = "Update stable docs to match verified behavior without changing documentation ownership or structure."
owner = "sync-truth"
instead_of = ["organize-docs"]

[[clusters.handoffs]]
when = "Restructure documentation ownership, layout, or search boundaries rather than record verified behavior."
owner = "organize-docs"
instead_of = ["sync-truth"]

[[clusters.handoffs]]
when = "Explain or audit current documentation, including README and AGENTS ownership, without a requested edit."
owner = "analyze-project"
instead_of = ["organize-docs", "sync-truth"]

[[clusters.handoffs]]
when = "Diagnose a live infrastructure incident whose runtime data path is the primary question."
owner = "infrastructure-triage"
instead_of = ["analyze-project"]

[[clusters]]
id = "runtime-and-safety"
members = ["infrastructure-triage", "error-patterns", "logging-standards", "security-guardrails", "sops-age-guardrails", "docker-multiarch-build"]
question = "Is the owner of an operational state still unknown, or is the decision a recovery policy for a known failure boundary, log events, preventive security controls, SOPS rules, or multi-architecture images?"

[[clusters.handoffs]]
when = "Diagnose an operational incident whose state owner is unknown, including a container runtime failure unrelated to image architecture."
owner = "infrastructure-triage"
instead_of = ["error-patterns", "docker-multiarch-build"]

[[clusters.handoffs]]
when = "Design in-process error handling or retry behavior for a known failure boundary."
owner = "error-patterns"
instead_of = ["infrastructure-triage", "logging-standards"]

[[clusters.handoffs]]
when = "Build a repeatable feedback loop for a reproducible code, test, or performance failure."
owner = "error-patterns:debugging-tight-loop"
instead_of = ["infrastructure-triage", "analyze-project"]

[[clusters.handoffs]]
when = "Apply a routine Ansible, container, or deployment configuration edit whose approach and authority are settled."
owner = "implement-change"
instead_of = ["infrastructure-triage"]

[[clusters.handoffs]]
when = "Choose log fields, audit events, redaction, retention, or tamper evidence."
owner = "logging-standards"
instead_of = ["error-patterns", "security-guardrails"]

[[clusters.handoffs]]
when = "Implement input validation, injection prevention, CORS, TLS, upload controls, or container hardening without a multi-architecture concern."
owner = "security-guardrails"
instead_of = ["logging-standards", "docker-multiarch-build"]

[[clusters.handoffs]]
when = "Edit SOPS creation rules, encryption regexes, or age recipient boundaries."
owner = "sops-age-guardrails"
instead_of = ["security-guardrails"]

[[clusters.handoffs]]
when = "Apply general application secret handling without SOPS or age."
owner = "security-guardrails"
instead_of = ["sops-age-guardrails"]

[[clusters]]
id = "verification-and-contracts"
members = ["testing-strategy", "api-contract-strategy", "skills-routing:oracle-selection"]
question = "Is what evidence would prove correctness still open, is coverage or lane placement for an established oracle in question, or is an API contract's ownership and compatibility the decision?"

[[clusters.handoffs]]
when = "Choose among oracle methods while what evidence would prove correctness is unresolved, even when the intended outcome is settled."
owner = "skills-routing:oracle-selection"
instead_of = ["testing-strategy", "design-change"]

[[clusters.handoffs]]
when = "Add routine tests under an established oracle and verification strategy."
owner = "implement-change"
instead_of = ["testing-strategy", "skills-routing:oracle-selection"]

[[clusters.handoffs]]
when = "Run existing checks or a known test suite without changing coverage or strategy."
owner = "none"
instead_of = ["testing-strategy"]

[[clusters.handoffs]]
when = "Make an ordinary implementation edit under a fixed API contract."
owner = "implement-change"
instead_of = ["api-contract-strategy"]

[[clusters.handoffs]]
when = "Choose general service boundaries unrelated to an API contract lifecycle."
owner = "architecture-patterns"
instead_of = ["api-contract-strategy"]

[[clusters]]
id = "architecture-and-methods"
members = ["architecture-patterns", "skills-routing:simplification", "skills-routing:language-selection", "skills-routing:tool-selection"]
question = "Is the decision a durable architecture boundary, a requested simplification assessment, the language of a persisted artifact, or the tools for the current ad hoc investigation?"

[[clusters.handoffs]]
when = "Choose the implementation language for a new persisted component."
owner = "skills-routing:language-selection"
instead_of = ["architecture-patterns", "skills-routing:tool-selection"]

[[clusters.handoffs]]
when = "Apply already decided boundaries or perform ordinary cleanup while implementing an approved task."
owner = "implement-change"
instead_of = ["architecture-patterns", "skills-routing:simplification"]

[[clusters.handoffs]]
when = "Assess whether existing code, tests, documents, or mechanisms are necessary, or which could be removed, without applying the result."
owner = "skills-routing:simplification"
instead_of = ["analyze-project"]

[[clusters.handoffs]]
when = "Review only the current diff rather than audit the current repository structure."
owner = "review-change"
instead_of = ["skills-routing:simplification"]

[[clusters.handoffs]]
when = "Choose commands or tools for the agent's current investigation."
owner = "skills-routing:tool-selection"
instead_of = ["skills-routing:language-selection"]

[[clusters.handoffs]]
when = "Run a routine known command with no open tool choice."
owner = "none"
instead_of = ["skills-routing:tool-selection"]

[[clusters]]
id = "implementation-policy"
members = ["development-standards", "go-guidelines", "python-guidelines", "shell-guidelines", "lua-guidelines", "powershell-guidelines", "routeros-scripting-guidelines"]
question = "Does the cross-language baseline suffice, or which existing or already selected language and file type adds its own conventions?"

[[clusters.handoffs]]
when = "Decide which language a new persisted component should use."
owner = "skills-routing:language-selection"
instead_of = ["go-guidelines", "python-guidelines", "shell-guidelines", "lua-guidelines", "powershell-guidelines"]

[[clusters.handoffs]]
when = "Define executable test layers or suite placement across languages."
owner = "testing-strategy"
instead_of = ["development-standards", "python-guidelines"]

[[clusters.handoffs]]
when = "Write or review POSIX or Bash Shell code rather than PowerShell."
owner = "shell-guidelines"
instead_of = ["powershell-guidelines"]

[[clusters.handoffs]]
when = "Choose search or structured-data tools without Shell-policy risk."
owner = "skills-routing:tool-selection"
instead_of = ["shell-guidelines"]

[[clusters.handoffs]]
when = "Edit Rime schema or dictionary YAML that contains no Lua code."
owner = "implement-change"
instead_of = ["lua-guidelines"]

[[clusters.handoffs]]
when = "Design RouterOS network policy or diagnose a live device without script source or event-body work."
owner = "infrastructure-triage"
instead_of = ["routeros-scripting-guidelines"]

[[clusters]]
id = "git-and-handoff"
members = ["smart-commit", "herdr-implement", "implement-change:worktree-isolation"]
question = "Group current diffs into focused commits, hand a plan to another main session through Herdr, isolate the current change in its own worktree or remove, prune, or repair an existing one, or perform an ordinary Git or delegation action?"

[[clusters.handoffs]]
when = "Create one ordinary commit without business-domain grouping."
owner = "none"
instead_of = ["smart-commit"]

[[clusters.handoffs]]
when = "Squash, reorder, or otherwise rewrite existing commits."
owner = "none"
instead_of = ["smart-commit"]

[[clusters.handoffs]]
when = "Implement a change or delegate a managed subagent task without a main-to-main Herdr handoff."
owner = "implement-change"
instead_of = ["herdr-implement"]

[[clusters.handoffs]]
when = "Inspect or control Herdr panes, tabs, workspaces, or commands without an implementation handoff."
owner = "none"
instead_of = ["herdr-implement"]

[[clusters.handoffs]]
when = "Implement serially in the current checkout without a worktree request, repository rule, branch requirement, or concrete conflict."
owner = "implement-change"
instead_of = ["implement-change:worktree-isolation"]

[[clusters.handoffs]]
when = "Remove, prune, or repair an existing Git worktree, which can discard uncommitted work or unique commits."
owner = "implement-change:worktree-isolation"
instead_of = ["none", "close-change"]

[[clusters]]
id = "session-and-history"
members = ["skills-routing:memory-boundary", "skill-miner"]
question = "Is the request about the current task's handoff, compaction, or recovery boundary, or an explicitly selected mining pass over past sessions and memory files?"

[[clusters.handoffs]]
when = "Mine past sessions or memory files for reusable Skill improvements or cleanup candidates."
owner = "skill-miner"
instead_of = ["skills-routing:memory-boundary"]

[[clusters.handoffs]]
when = "Analyze current repository files without explicitly selecting skill-miner."
owner = "analyze-project"
instead_of = ["skill-miner"]

[[clusters.handoffs]]
when = "Recover or merge persisted Codex session files across homes."
owner = "none"
instead_of = ["skill-miner", "skills-routing:memory-boundary"]

[[clusters]]
id = "skill-authoring"
members = ["skill-authoring", "skills-routing"]
question = "Is the request to write or revise a Skill's discovery surface and boundaries, or to choose which Skill should own the current task?"

[[clusters.handoffs]]
when = "Choose which Skill owns an ambiguous coding request."
owner = "skills-routing"
instead_of = ["skill-authoring"]

[[clusters.handoffs]]
when = "Change only a Skill's domain method without touching its description, boundaries, or activation."
owner = "implement-change"
instead_of = ["skill-authoring"]

[[clusters.handoffs]]
when = "Measure Skill selection or behavior with probes or controlled comparisons."
owner = "testing-strategy:agent-skill-evaluation"
instead_of = ["skill-authoring"]
