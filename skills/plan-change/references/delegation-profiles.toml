semantic_vocabulary_version = 1
runtime_contract = false
# Optional execution preferences: fast favors quick turnaround; balanced weighs cost and quality; deep favors complex work.
execution_profiles = ["fast", "balanced", "deep"]
# Optional independent thinking effort: light favors low overhead; standard routine reasoning; deep more deliberation.
# Use an execution preference alone when the host route already provides suitable thinking effort.
# Hosts own concrete model bindings, provider-level adaptation and fallback; these hints remain portable intent.
thinking_profiles = ["light", "standard", "deep"]
delegation_ready_facts = [
  "repository_owner",
  "write_set",
  "resource_locks",
  "isolation",
  "convergence_owner",
  "verification",
  "done_when",
  "failure_policy",
]
forbidden_binding_keys = [
  "provider",
  "model",
  "thinking_level",
  "tool_arguments",
  "working_directory_flag",
  "scheduler_limit",
  "retry_count",
  "actor_binding",
  "attempt_state",
  "session_state",
]
