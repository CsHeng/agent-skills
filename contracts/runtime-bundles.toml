[bundles.harness]
source = "src/runtime/harness"
destination = "scripts/harness"
files = ["__init__.py", "artifacts.py", "binding.py", "cli.py", "external_touch.py", "ledger.py", "lifecycle.py"]

[[bundles.harness.projections]]
kind = "lifecycle-contracts-v1"
destination = "resources/lifecycle-contracts.json"
sources = [
  "contracts/lifecycle.toml",
  "contracts/workflow-modes.toml",
  "src/skills/session/use-coding-skills/references/routing.toml",
]
