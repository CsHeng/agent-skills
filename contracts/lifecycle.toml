[lifecycle]
kernel = ["analyze-project", "design-change", "plan-change", "implement-change", "review-change", "sync-truth", "close-change"]
purpose = "provider-neutral semantic workflow guidance"
router = "optional ambiguity resolution; direct skill matches bypass it"

[routing]
read_only = ["explanation", "repository inspection", "debugging hypothesis", "documentation audit", "inventory"]
micro = ["typo", "local documentation fix", "narrow script fix", "bounded low-risk edit"]
standard = ["ordinary feature", "ordinary fix", "ordinary refactor"]
regulated = ["infrastructure", "network", "secrets", "authentication", "security", "deployment", "public API", "data migration"]
emergency = ["outage", "broken local workflow", "urgent revert", "minimal break/fix"]

[authority]
workflow_category = "workflow"
lower_plane_categories = ["session", "discipline", "policy", "tool", "manual-tool", "review-component"]
mutation_requires = "explicit user request or approved upstream artifact"

[formal_review]
owners = ["design-change", "plan-change", "implement-change"]
review_skill = "review-change"
reviews_per_invocation = 1
review_is_read_only = true
caller_adjudicates = true
informal_work_review = "not implied"
standalone_review_requires_upstream_phase = false
