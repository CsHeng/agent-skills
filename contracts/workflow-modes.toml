[modes.read_only]
description = "Analysis, triage, explanation, audit, inventory, or fact gathering without repository mutation."
suggested_skills = ["analyze-project"]
phases = ["analyze"]
formal_workflow = false
review_expectation = "none unless directly requested"

[modes.micro]
description = "Small bounded change with low truth impact and low boundary impact."
suggested_skills = ["implement-change"]
phases = ["execute", "verify"]
formal_workflow = false
review_expectation = "none unless a formal workflow skill is invoked or review is directly requested"

[modes.standard]
description = "Normal software change."
suggested_skills = ["design-change", "plan-change", "implement-change"]
phases = ["design-lite", "review-design", "plan", "review-plan", "execute", "verify", "review-impl"]
formal_workflow = true
review_expectation = "each invoked formal design, plan, or implementation skill performs one bounded review"

[modes.regulated]
description = "High-risk infrastructure, security, deployment, public API, irreversible data, or high-blast-radius work requiring explicit recovery and fresh evidence."
suggested_skills = ["analyze-project", "design-change", "plan-change", "implement-change", "sync-truth", "close-change"]
phases = ["analyze", "design-full", "review-design", "plan", "review-plan", "execute", "verify", "review-impl", "sync-truth", "close"]
formal_workflow = true
review_expectation = "each invoked formal design, plan, or implementation skill performs one bounded review"
recovery_expectation = "fix forward unless an exact guarded rollback is approved"

[modes.emergency]
description = "Break/fix guidance that minimizes up-front ceremony and records stable truth after verified recovery."
suggested_skills = ["analyze-project", "implement-change", "sync-truth", "close-change"]
phases = ["triage", "execute", "verify", "sync-truth", "close"]
formal_workflow = false
review_expectation = "none unless a formal workflow skill is invoked or review is directly requested"
