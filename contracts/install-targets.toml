[installation]
source = "skills"
recommended_manager = "npx skills@latest"
recommended_user_root = "~/.agents/skills"
content_boundary = "independent-copy"
update_policy = "explicit-install-or-update"
duplicate_invariant = "one-active-discovery-path-per-tool-and-public-id"

[plugins]
providers = ["claude", "codex"]
policy = "optional-managed-copy"
