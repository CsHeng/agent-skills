[semantic_install]
dependency_resolution = "consumer"
selective_install_requires_transitive_closure = true
complete_profile = "sovereign-harness"

[profiles.sovereign-harness]
selection = "all-public"

[command_retirement]
archive_destination = "archived/commands"
archive_ready = true
absorbed_by_skill = ["close-change", "design-change", "implement-change", "plan-change", "review-change", "sync-truth"]
thin_wrappers = ["analyze-project", "review-design", "review-implementation", "review-plan", "smart-commit"]
archive_only = ["check-secrets"]

[activation_modes.native]
codex_allow_implicit_invocation = true
claude_effective_visibility = "default-visible"

[activation_modes.conditional]
codex_allow_implicit_invocation = true
claude_effective_visibility = "default-visible"

[activation_modes.controller]
codex_allow_implicit_invocation = false
claude_effective_visibility = "default-visible"

[activation_modes.explicit]
codex_allow_implicit_invocation = false
claude_effective_visibility = "default-visible"

[activation_modes.baseline]
codex_allow_implicit_invocation = true
claude_effective_visibility = "default-visible"

